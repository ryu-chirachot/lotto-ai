name: Update data & deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 10:30 UTC = 17:30 ICT, after the Thai draw results are published
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Fetch new Thai results (GLO API)
        if: github.event_name != 'push'
        working-directory: backend
        continue-on-error: true # a GLO outage should not block the deploy
        run: python -m app.scrapers.seed_data update-thai

      - name: Extend synthetic Lao data to today
        if: github.event_name != 'push'
        working-directory: backend
        continue-on-error: true # refuses (non-zero) once real Lao data is imported
        run: python -m app.scrapers.seed_data seed-lao

      - name: Test engines
        working-directory: backend
        run: python -m pytest -q

      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- backend/data; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/data
            git commit -m "data: update lottery results"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build static site
        working-directory: frontend
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
